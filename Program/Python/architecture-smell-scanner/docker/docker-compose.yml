version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smell_scanner_db
    environment:
      POSTGRES_USER: smellscanner
      POSTGRES_PASSWORD: smellscanner123
      POSTGRES_DB: smellscanner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smellscanner"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smell_scanner_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smell_scanner_api
    environment:
      DATABASE_URL: postgresql+asyncpg://smellscanner:smellscanner123@postgres:5432/smellscanner
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: your-secret-key-change-in-production
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - code_storage:/app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smell_scanner_web
    ports:
      - "3000:80"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smell_scanner_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://smellscanner:smellscanner123@postgres:5432/smellscanner
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: your-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - code_storage:/app/storage
    command: celery -A app.worker.celery_app worker --loglevel=info

volumes:
  postgres_data:
  code_storage: